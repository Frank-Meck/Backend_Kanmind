services:

  kanmind_backend:
    container_name: kanmind_backend
    build:
      context: ./backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
    networks:
      - kanmind_network

  kanmind_nginx:
    container_name: kanmind_nginx
    image: nginx:latest
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - kanmind_backend
    networks:
      - kanmind_network
      - web

networks:
  kanmind_network:

  web:
    external: true
